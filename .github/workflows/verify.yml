name: Verify N.E.K.O Plugin

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: neko_danmaku

      - name: Checkout N.E.K.O build tools
        uses: actions/checkout@v4
        with:
          repository: Project-N-E-K-O/N.E.K.O
          ref: main
          path: neko

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: Install test tools
        run: >-
          python -m pip install --disable-pip-version-check
          pytest ruff==0.12.4 pydantic packaging portalocker "httpx[socks]"
          python-dotenv ormsgpack pyzmq orjson fastapi uvicorn pydantic-settings
          psutil filelock requests websocket-client

      - name: Run tests
        shell: pwsh
        working-directory: neko_danmaku/tests
        run: |
          python -m pytest . -q -p no:cacheprovider

      - name: Run market-pinned Ruff rules
        working-directory: neko_danmaku
        run: >-
          python -m ruff check --ignore-noqa --isolated
          --no-respect-gitignore --target-version py311 --line-length 120
          --select E4,E7,E9,F,I --exclude vendor .

      - name: Build plugin package
        shell: pwsh
        run: |
          Push-Location neko
          try {
            python -m plugin.neko_plugin_cli build `
              (Join-Path $env:GITHUB_WORKSPACE "neko_danmaku") `
              --target-dir (Join-Path $env:GITHUB_WORKSPACE "dist")
          } finally {
            Pop-Location
          }

      - name: Verify release package
        shell: pwsh
        run: |
          $package = Join-Path $env:GITHUB_WORKSPACE "dist\neko_danmaku.neko-plugin"
          if (-not (Test-Path -LiteralPath $package -PathType Leaf)) {
            throw "Package was not created: $package"
          }
          python -c "import zipfile; p=r'$package'; z=zipfile.ZipFile(p); names=z.namelist(); assert 'manifest.toml' in names; assert 'payload/plugins/neko_danmaku/plugin.toml' in names; assert any('/vendor/PySide6/' in n for n in names)"
          $hash = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "package=neko_danmaku.neko-plugin"
            "sha256=$hash"
            "size=$((Get-Item -LiteralPath $package).Length)"
          ) | Set-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "dist\verification.txt") -Encoding utf8

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: neko-danmaku-package
          if-no-files-found: error
          path: |
            dist/neko_danmaku.neko-plugin
            dist/verification.txt

  market-verify:
    if: ${{ github.workflow == 'Verify N.E.K.O Plugin' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    uses: Project-N-E-K-O/N.E.K.O/.github/workflows/plugin-market-verify.yml@09842497dffc41d41d88d2d8be88a0d90f738c69
    with:
      plugin-id: neko_danmaku
      neko-ref: 09842497dffc41d41d88d2d8be88a0d90f738c69
